name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install sandbox dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
      - name: Install project and quality tools
        run: python -m pip install --disable-pip-version-check -e . ruff==0.16.3
      - name: Unit tests
        run: python -m unittest discover -s tests -v
        env:
          AI_ORCHESTRATOR_STATE: ${{ runner.temp }}/ai-orchestrator-state
          XDG_CONFIG_HOME: ${{ runner.temp }}/xdg-config
          XDG_CACHE_HOME: ${{ runner.temp }}/xdg-cache
          XDG_DATA_HOME: ${{ runner.temp }}/xdg-data
      - name: Lint
        run: ruff check src tests scripts
      - name: Format check
        run: ruff format --check src tests scripts
