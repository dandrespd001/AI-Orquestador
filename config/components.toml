schema_version = 2

[components.deepseek-harness]
version = "0.1.1-rc.2"
source = "npm:@deepseek-ai/dsh"
integrity = "sha512-UP1UIh6q3Gme/yXRn/QL2P8IsVlv8Shpg22TRJIZPsCRWLm4CBiA1MUvXmJAfsOEETBMLAl+xWPtFw6ICsN3wg=="
install_slot = "deepseek-harness/0.1.1-rc.2"
active = true
active_executable = "node_modules/.bin/dsh"
auto_update = false
update_policy = "manual_promote"
update_channel = "latest"
compatibility_tests = ["contracts", "broker", "sessions", "client-catalog"]
security_tests = ["bubblewrap-escape-regression", "loopback-only", "socket-0600", "secret-redaction"]
rollback_eligible = true

