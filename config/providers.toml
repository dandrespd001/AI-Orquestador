[[providers]]
id = "abacus"
endpoint = "cli://abacusai@2.6.9"
protocol = "oauth_cli"
# Observados en la cuenta autenticada el 2026-08-20. La presencia en el
# catalogo no implica ruta automatica: abacus.py mantiene el allowlist, exige
# opt-in para GLM 5.3 y nunca hace fallback silencioso. Los nombres reales del
# selector CLI se conservan como route_model en models.toml.
models = ["abacus-grok-4.6", "abacus-qwen3.8-max", "abacus-qwen3.8-27b", "abacus-glm-5.3"]
authentication = "human_cli_login"
quota = "pro_included_credits_only"
trust = "official_subscription"
capabilities = ["read", "write", "tools", "credits"]
canary = "abacus"
incremental_spend_allowed = false
content_retention_allowed = false

