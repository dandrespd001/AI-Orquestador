schema_version = 1

[[providers]]
id = "openai"
endpoint = "cli://codex"
protocol = "official_cli"
models = ["gpt-5.6-sol", "gpt-5.6-terra", "gpt-5.6-luna"]
authentication = "oauth_official_store"
quota = "subscription_included"
trust = "official_subscription"
capabilities = ["read", "write", "tools"]
canary = "codex_cli"
incremental_spend_allowed = false
content_retention_allowed = false

