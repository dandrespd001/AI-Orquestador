[[models]]
# Sondeado vivo el 2026-08-14: ds/deepseek-v4-pro responde en 2043 ms.
# Coexiste con Flash a proposito: Pro para razonamiento acotado y auditoria,
# Flash para volumen. El enrutador elige por rol, no por preferencia.
id = "deepseek-v4-pro"
family = "deepseek"
provider = "deepseek"
transport = "qwen_omniroute_cli"
route_model = "ds/deepseek-v4-pro"
official = true
status = "available"
roles = ["review", "bounded_cpp", "implementation", "statistics"]
max_sensitivity = "internal"
max_concurrency = 2
trust_tier = "official_subscription"
capabilities = ["read", "write", "tools"]
# Promovido a escritor nativo acotado el 2026-08-14 con canario 5/5
# (docs/receipts/deepseek-v4-pro-native-2026-08-14.json). Edita el arbol
# desechable directamente, que es lo que le permite iterar y tocar ficheros
# grandes; NO auto-aplica al repo de origen — termina en PATCH_READY y lo
# revisa el Arquitecto. Unico modelo de transporte Qwen con este perfil: los
# demas siguen entregando parche hasta que su propio canario los justifique.
execution_profile = "native_patch_writer"
# Ventana real, gateway OmniRoute y config de Qwen.
context_window = 1000000
# El proveedor deepseek es el unico que declara la capacidad
# "cache" en providers.toml.
cache_supported = true
# Preferencia del operador, no una medicion: por debajo de flash por decision explicita del Director.
quality_score = 0.8

[[models]]
id = "deepseek-v4-flash"
family = "deepseek"
provider = "deepseek"
transport = "qwen_omniroute_cli"
route_model = "ds/deepseek-v4-flash"
official = true
status = "available"
roles = ["tests", "boilerplate", "docs", "implementation", "bounded_cpp"]
max_sensitivity = "internal"
max_concurrency = 3
trust_tier = "official_subscription"
capabilities = ["read", "write", "tools"]
# Promovido a escritor nativo acotado el 2026-08-18 con canario 5/5
# (docs/receipts/deepseek-v4-flash-native-2026-08-18.json). Es el PRIMARIO de
# bounded_cpp por decision de coste del Director: Pro cuesta 3,1x lo que Flash
# ($0,435/$0,87 contra $0,14/$0,28 por millon) por 1,6 puntos de SWE-bench
# Verified. Pro queda para encargos cortos o poco intensivos.
#
# Sin este perfil la regla NO ahorraria, romperia la delegacion: roles.toml ya
# listaba Flash primero, y por patch_api_writer habria ido a la ruta HTTP que
# agoto el presupuesto de razonamiento en todos los encargos reales del 08-14.
execution_profile = "native_patch_writer"
# Ventana real, gateway OmniRoute y config de Qwen.
context_window = 1000000
# El proveedor deepseek es el unico que declara la capacidad
# "cache" en providers.toml.
cache_supported = true
# Preferencia del operador, no una medicion: caballo de batalla del Director: tests, docs, boilerplate y C++ acotado, con cache.
quality_score = 0.89

