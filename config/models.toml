billing_mode = "prepaid_balance_only"
input_per_mtok_usd = 0.435
output_per_mtok_usd = 0.87
economics_source = "DeepSeek official pricing"
economics_verified_at = "2026-08-20T00:00:00+00:00"
economics_confidence = "verified"
trust_tier = "official_subscription"
capabilities = ["read", "write", "tools"]
# Promovido a escritor nativo acotado el 2026-08-14 con canario 5/5
# (docs/receipts/deepseek-v4-pro-native-2026-08-14.json). Edita el arbol
# desechable directamente, que es lo que le permite iterar y tocar ficheros
# grandes; NO auto-aplica al repo de origen — termina en PATCH_READY y lo
# revisa el Arquitecto. Unico modelo de transporte Qwen con este perfil: los
# demas siguen entregando parche hasta que su propio canario los justifique.
execution_profile = "native_patch_writer"

