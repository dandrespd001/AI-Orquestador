schema_version = 1

# Cada rol fija el presupuesto de razonamiento que los adaptadores nativos
# reciben por argv. Los writers externos ignoran el nivel, pero conservan el
# mismo orden de selección y siempre pasan por worktree + gates.
#
# Criterio de composición, fijado por el Director el 2026-08-25: cada modelo
# encabeza los roles donde es mejor, con sesgo explícito hacia las
# suscripciones que estaban infrautilizadas (Kimi, MiniMax, Abacus, DeepSeek).
#
# Dos reglas hacen que esto funcione sin listas separadas por modo:
#   - Los modelos de Abacus y FX declaran capabilities = ["read"], así que
#     routing.py:217 los descarta solo en cualquier tarea de escritura. Van
#     primeros en los roles de análisis: ganan la lectura, ceden la escritura.
#   - quality_score domina la puntuación (peso 0.34) frente al orden de lista
#     (peso 0.02). Un modelo que no debe encabezar un rol se omite de `models`
#     y se conserva en `reviewers`; dejarlo en la lista lo haría ganar.

# Análisis de diseño: Grok gana la lectura; los escritores nativos toman la
# tarea en cuanto pide patch.
[roles.architecture]
models = ["abacus-grok-4.6", "claude-opus", "gpt-5.6-sol"]
reviewers = ["gpt-5.6-sol", "claude-opus"]
reasoning_effort = "xhigh"
reviewer_reasoning_effort = "xhigh"

# Terra encabeza: es su especialidad declarada. Opus queda de revisor, no en
# `models`, porque su 0.90 le haría ganar el rol.
[roles.statistics]
models = ["gpt-5.6-terra", "deepseek-v4-pro"]
reviewers = ["claude-opus", "gpt-5.6-sol"]
reasoning_effort = "high"
reviewer_reasoning_effort = "high"

# Auditoría de seguridad: Grok la lee, Opus la escribe.
[roles.security]
models = ["abacus-grok-4.6", "claude-opus", "gpt-5.6-terra"]
reviewers = ["gpt-5.6-sol", "claude-opus"]
reasoning_effort = "xhigh"
reviewer_reasoning_effort = "xhigh"

# Kimi encabeza la escritura y Qwen3.8 Max el análisis previo. Sol va al
# final: no encabeza el rol, pero es el escritor nativo que exigen las rutas
# protegidas, y sin él claude-sonnet era el único camino para esas entradas.
[roles.implementation]
models = [
    "abacus-qwen3.8-max",
    "kimi-official",
    "openrouter-north-code-free",
    "mistral-devstral-free",
    "cloudflare-qwen25-coder-free",
    "deepseek-v4-flash",
    "claude-sonnet",
    "gpt-5.6-sol",
]
reviewers = ["claude-opus", "gpt-5.6-terra"]
reasoning_effort = "high"
reviewer_reasoning_effort = "high"

# La ruta gratuita verificada va primera: en repo público gana y conserva
# cuota de suscripción; en repo privado la puerta web_free la descarta sola y
# el rol cae en DeepSeek Flash, el caballo de batalla que pidió el Director.
[roles.tests]
models = [
    "abacus-qwen3.8-max",
    "gemini-free-fast",
    "openrouter-north-code-free",
    "mistral-devstral-free",
    "cloudflare-qwen25-coder-free",
    "deepseek-v4-flash",
    "claude-sonnet",
    "gpt-5.6-sol",
]
reviewers = ["gpt-5.6-sol", "claude-opus"]
reasoning_effort = "high"
reviewer_reasoning_effort = "high"

# Carril barato, con la ruta gratuita primero por el mismo motivo que tests.
# MiniMax se omite a propósito: rinde más en contexto largo y refactor masivo,
# y su 0.91 se llevaría también este rol.
[roles.boilerplate]
models = [
    "gemini-free-fast",
    "openrouter-north-code-free",
    "cloudflare-qwen25-coder-free",
    "mistral-devstral-free",
    "deepseek-v4-flash",
    "gpt-5.6-luna",
]
reviewers = ["gpt-5.6-sol", "claude-sonnet"]
reasoning_effort = "medium"
reviewer_reasoning_effort = "high"

# La especialidad de MiniMax: 1.048.576 de ventana y capacidad long_context
# declarada por el proveedor.
[roles.long_context]
models = [
    "MiniMax-M3",
    "abacus-qwen3.8-max",
    "kimi-official",
    "claude-opus",
]
reviewers = ["gpt-5.6-sol", "claude-opus"]
reasoning_effort = "high"
reviewer_reasoning_effort = "high"

# MiniMax lleva research desde el 2026-08-25, por decision del Director, y
# kimi-official SALE de la lista por el mismo motivo por el que Grok nunca
# estuvo: con 0.91 ganaria siempre la lectura y se quedaria sin cuota para
# desarrollo, interfaces y graficos, que es donde agrega valor que otros no
# dan. Estar en `models` no es ser una opcion: es ganar. Investigar es contexto
# largo y lectura, el nicho de M3, y ademas no consume la cuota de Kimi.
[roles.research]
# El Director abrio la web a este rol el 2026-08-25: investigar sin poder
# mirar fuera del repositorio no es investigar.
web_access = true
models = [
    "MiniMax-M3",
    "fx-glm-5.2-promo",
    "claude-sonnet",
]
reviewers = ["gpt-5.6-terra", "claude-opus"]
reasoning_effort = "high"
reviewer_reasoning_effort = "high"

# MiniMax encabeza documentación: volumen alto y contexto amplio.
[roles.docs]
# Documentar suele exigir consultar la API o la referencia real de un tercero.
web_access = true
models = [
    "MiniMax-M3",
    "deepseek-v4-flash",
    "fx-glm-5.2-promo",
    "gemini-free-fast",
    "openrouter-north-code-free",
    "mistral-devstral-free",
    "cloudflare-qwen25-coder-free",
    "claude-sonnet",
]
reviewers = ["gpt-5.6-sol", "claude-sonnet"]
reasoning_effort = "medium"
reviewer_reasoning_effort = "high"

[roles.bulk_refactor]
models = [
    "abacus-qwen3.8-max",
    "MiniMax-M3",
    "gpt-5.6-sol",
    "claude-sonnet",
]
reviewers = ["claude-opus", "gpt-5.6-sol"]
reasoning_effort = "high"
reviewer_reasoning_effort = "xhigh"

# Revisión: es exactamente el trabajo de un modelo de solo lectura, y donde
# la suscripción de Abacus rinde sin fricción.
[roles.review]
models = [
    "abacus-grok-4.6",
    "fx-glm-5.2-promo",
    "mistral-devstral-free",
    "gpt-5.6-terra",
    "deepseek-v4-pro",
    "claude-opus",
]
reviewers = ["claude-opus", "gpt-5.6-sol"]
reasoning_effort = "high"
reviewer_reasoning_effort = "xhigh"

# C++ acotado: Flash por delante de Pro, por decisión del Director. Sol sale
# de `models` para no arrebatarle el rol por 0.01.
[roles.bounded_cpp]
models = ["deepseek-v4-flash", "deepseek-v4-pro", "claude-sonnet"]
reviewers = ["gpt-5.6-sol", "claude-opus"]
reasoning_effort = "high"
reviewer_reasoning_effort = "xhigh"

# Determinismo se queda con los escritores nativos: es donde el golden manda.
[roles.determinism]
models = ["gpt-5.6-sol", "claude-opus"]
reviewers = ["claude-opus", "gpt-5.6-terra"]
reasoning_effort = "xhigh"
reviewer_reasoning_effort = "xhigh"

[roles.godot_ui]
models = ["kimi-official", "gpt-5.6-luna", "claude-sonnet"]
reviewers = ["claude-sonnet", "gpt-5.6-sol"]
reasoning_effort = "high"
reviewer_reasoning_effort = "high"

# ---------------------------------------------------------------------------
# Roles no centrados en codigo, anadidos el 2026-08-25. Hasta aqui los catorce
# roles eran de programacion, con dos especificos de CHUNSA, y el orquestador
# no cubria diseno, edicion de prosa, analisis de datos ni nada con imagen.
# ---------------------------------------------------------------------------

# Interfaz, experiencia, maquetacion y sistemas visuales. Distinto de godot_ui,
# que es la interfaz concreta de CHUNSA.
[roles.design]
web_access = true
models = [
    "kimi-official",
    "claude-sonnet",
    "gpt-5.6-luna",
]
reviewers = ["claude-sonnet", "gpt-5.6-sol"]
reasoning_effort = "high"
reviewer_reasoning_effort = "high"

# Edicion de prosa: reescritura, correccion, traduccion y ajuste de tono.
# Distinto de docs, que es escribir documentacion tecnica desde cero. MiniMax
# encabeza por la misma razon que en long_context: el texto largo es suyo.
[roles.content_edit]
models = [
    "MiniMax-M3",
    "kimi-official",
    "claude-sonnet",
]
reviewers = ["claude-opus", "gpt-5.6-terra"]
reasoning_effort = "medium"
reviewer_reasoning_effort = "high"

# Exploracion de datos, tablas y notebooks. Distinto de statistics, que es
# rigor estadistico y va con presupuesto de razonamiento alto.
[roles.data_analysis]
models = [
    "abacus-qwen3.8-max",
    "MiniMax-M3",
    "gpt-5.6-terra",
    "deepseek-v4-flash",
]
reviewers = ["gpt-5.6-terra", "claude-opus"]
reasoning_effort = "high"
reviewer_reasoning_effort = "high"

