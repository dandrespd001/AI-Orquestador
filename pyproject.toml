[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-orchestrator"
version = "0.2.0"
description = "Local policy control plane for official and approved community AI capabilities"
requires-python = ">=3.12,<3.15"
dependencies = []

[project.optional-dependencies]
eval = [
  "inspect-ai>=0.3,<1",
  "mlflow>=3,<4",
]
optimize = [
  "dspy==3.3.0",
]

[project.scripts]
ai-orchestrator = "ai_orchestrator.cli:main"
ai-orchestrator-omniroute-wrapper = "ai_orchestrator.service_wrapper:main"
omniroute-safe = "ai_orchestrator.omniroute_safe:main"
ai-orchestrator-mcp = "ai_orchestrator.mcp_tools:serve_stdio"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
