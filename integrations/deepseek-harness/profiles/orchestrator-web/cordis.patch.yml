# Full interactive Web surface. The outer systemd sandbox owns workspace scope.
- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js process.cwd()

- id: approval
  config:
    policy: ask

- id: tool-bash
  disabled: false

- id: tool-fs
  disabled: false

- id: tool-fs-search
  disabled: false
  config:
    sampleOverCapGlobResults: false

- id: agent-instructions
  disabled: false
  config:
    maxBytes: 32768
    maxSourceBytes: 131072
    instructionFileCandidates: [AGENTS.md]
    localInstructionFileCandidates: [AGENTS.local.md]

- id: skill-filesystem
  disabled: false

- id: tool-skill
  disabled: false

- id: compaction-basic
  disabled: false

- id: command-compact
  disabled: false

- id: tool-todo
  disabled: false

- id: tool-goal
  disabled: false

- id: tool-str-replace-editor
  disabled: false
  config:
    maxOutputChars: 16000

# Bounded research egress. The dedicated loopback proxy enforces MCP methods,
# tool names, public URLs and output limits before contacting its fixed upstream.
- insert:
    - id: mcp-web-search
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: web-search
        transport: streamable-http
        url: !!js process.env.AI_ORCHESTRATOR_WEB_SEARCH_URL ?? 'http://127.0.0.1:20130/mcp'
        headers:
          Authorization: !!js "'Bearer ' + process.env.AI_ORCHESTRATOR_WEB_SEARCH_CREDENTIAL"
        toolCallTimeoutMs: 60000
        failOnStartupError: true
        reconnect:
          enabled: true
          initialDelayMs: 500
          maxDelayMs: 10000
          maxAttempts: 3
