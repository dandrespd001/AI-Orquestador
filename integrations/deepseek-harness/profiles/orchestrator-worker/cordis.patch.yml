# One-shot worker: direct editing plus the strict MCP and skill loader only.
- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js process.cwd()

- id: approval
  config:
    policy: never

- id: permission
  config:
    defaultPreset: orchestrator-worker
    presets:
      orchestrator-worker:
        sandbox: workspace-write
        approval: never

- id: agent-instructions
  config:
    maxBytes: 32768
    maxSourceBytes: 131072
    instructionFileCandidates: [AGENTS.md]
    localInstructionFileCandidates: []

- id: tool-jobs
  disabled: true

- id: subagent
  disabled: true

- id: subagent-spawn-in-process
  disabled: true

- id: subagent-fork-in-process
  disabled: true

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: tool-subagent-report
  disabled: true

- id: workflow-worker-thread
  disabled: true

- id: tool-workflow
  disabled: true

- id: tool-ralph
  disabled: true

- id: tool-todo
  disabled: true

- id: tool-goal
  disabled: true

- id: tool-bash
  config:
    timeoutMs: 300000

- id: tool-str-replace-editor
  config:
    maxOutputChars: 16000
