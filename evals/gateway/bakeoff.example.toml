schema_version = 1
repetitions = 30
warmups = 5
timeout_seconds = 10

# Start each pinned candidate separately on these loopback ports. The harness
# intentionally cannot start containers or reach non-loopback endpoints.
[[targets]]
name = "omniroute-3.8.48"
version = "3.8.48"
base_url = "http://127.0.0.1:21001"
official_providers = ["deepseek", "moonshot", "minimax"]
provider_coverage_attested = true
custom_provider_code = false
content_logging = false
immutable_ref = "npm:omniroute@3.8.48#REPLACE_WITH_INTEGRITY_SHA512"

